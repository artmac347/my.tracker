<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LOCKED IN. | Habit Tracker</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#09090d">
    <link rel="icon" href="icon.svg" type="image/svg+xml">

</head>

<body>

    <main class="app">

        <!-- HEADER -->
        <header class="header">
            <div class="brand">
                <span class="brand-icon">L.</span>
                <span>LOCKED IN.</span>
            </div>

            <div class="profile">
                <span>MY JOURNEY</span>
            </div>
        </header>

        <!-- TABS -->
        <nav class="tabs" id="tabs">
            <button type="button" class="tab active" data-tab="habits">My Habits</button>
            <button type="button" class="tab" data-tab="work">Construction Work</button>
            <button type="button" class="tab" data-tab="vitamins">Daily Vitamins</button>
            <button type="button" class="tab" data-tab="records">All Records</button>
        </nav>

        <!-- GREETING -->
        <section class="welcome">
            <p class="eyebrow">YOUR PERSONAL TRACKER</p>

            <h1>Become better.<br>
                <span>Every single day.</span>
            </h1>

            <p class="subtitle">
                Small actions. Consistent progress.
                Build the person you want to become.
            </p>
        </section>

        <!-- PANELS (ginagawa ng script.js) -->
        <div id="panels"></div>

        <!-- FOOTER -->
        <footer class="footer">
            <p>DISCIPLINE TODAY. FREEDOM TOMORROW.</p>
            <span>MADE FOR GROWTH.</span>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
